name: Validate SDK Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build SDK Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            cmake \
            meson \
            ninja-build \
            nasm \
            pkg-config \
            doxygen \
            graphviz \
            libvulkan-dev \
            vulkan-tools \
            vulkan-validationlayers \
            libglm-dev \
            libgtest-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            curl \
            ca-certificates

      - name: Build static implementation dependencies
        run: |
          chmod +x RenderingEngine/Scripts/build_static_dependencies_unix.sh
          STATIC_DEPS_WORK_DIR="${RUNNER_TEMP}/RenderingEngineThirdPartySources" \
            RenderingEngine/Scripts/build_static_dependencies_unix.sh

      - name: Verify static implementation dependencies
        run: |
          test -f /usr/local/lib/libjpeg.a
          test -f /usr/local/lib/libpng16.a
          test -f /usr/local/lib/libfreetype.a
          test -f /usr/local/lib/libharfbuzz.a
          test -f /usr/local/lib/libassimp.a
          test -f /usr/local/lib/libglfw3.a

          ls -lh \
            /usr/local/lib/libjpeg.a \
            /usr/local/lib/libpng16.a \
            /usr/local/lib/libfreetype.a \
            /usr/local/lib/libharfbuzz.a \
            /usr/local/lib/libassimp.a \
            /usr/local/lib/libglfw3.a

      - name: Build SDK
        run: |
          chmod +x build_engine.sh
          ./build_engine.sh --build-sdk

      - name: Upload Linux SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderingEngine-SDK-Linux
          path: Build/Packages/RenderingEngine-v*-SDK-Linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build SDK Windows
    runs-on: [self-hosted, Windows, X64, sdk-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: powershell
        run: |
          where cl
          where cmake

      - name: Build SDK
        shell: cmd
        run: build_engine.bat --build-sdk

      - name: Upload Windows SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderingEngine-SDK-Windows
          path: Build/Packages/RenderingEngine-v*-SDK-Windows.tar.gz

  build-freebsd:
    name: Build SDK FreeBSD
    runs-on: [self-hosted, Linux, X64, sdk-freebsd]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          uname -a
          which cmake

      - name: Build SDK
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          chmod +x build_engine.sh
          ./build_engine.sh --build-sdk

      - name: Upload FreeBSD SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderingEngine-SDK-FreeBSD
          path: Build/Packages/RenderingEngine-v*-SDK-FreeBSD.tar.gz